<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TP 10 - Dashboard Étudiants</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 15px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); overflow: hidden; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; text-align: center; }
        .controls { padding: 30px; background: #f8f9fa; border-bottom: 2px solid #e9ecef; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .control-group { display: flex; flex-direction: column; }
        .control-group label { font-weight: 600; margin-bottom: 8px; color: #495057; font-size: 0.9em; text-transform: uppercase; }
        input, select, button { padding: 12px 15px; border: 2px solid #dee2e6; border-radius: 8px; font-size: 1em; }
        button { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; cursor: pointer; font-weight: 600; }
        .stats { padding: 20px 30px; background: #fff; display: flex; justify-content: space-around; flex-wrap: wrap; gap: 15px; border-bottom: 2px solid #e9ecef; }
        .stat-card { text-align: center; padding: 15px 25px; border-radius: 10px; color: white; min-width: 150px; background: #667eea; }
        .table-container { padding: 30px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        thead { background: #667eea; color: white; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        .badge { padding: 5px 12px; border-radius: 20px; font-size: 0.85em; font-weight: 600; }
        .badge-iad { background: #e3f2fd; color: #1976d2; }
        .badge-ars { background: #f3e5f5; color: #7b1fa2; }
        .badge-glbd { background: #e8f5e9; color: #388e3c; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Dashboard Étudiants</h1>
            <p>Gestion des performances académiques [cite: 57]</p>
        </div>
        <div class="controls">
            <div class="control-group">
                <label for="searchInput">🔍 Recherche par nom</label>
                <input type="text" id="searchInput" placeholder="Rechercher...">
            </div>
            <div class="control-group">
                <label for="parcoursFilter">📚 Filtrer par parcours</label>
                <select id="parcoursFilter">
                    <option value="">Tous les parcours</option>
                    <option value="IAD">IAD</option>
                    <option value="ARS">ARS</option>
                    <option value="GLBD">GLBD</option>
                </select>
            </div>
            <div class="control-group">
                <label>&nbsp;</label>
                <button id="exportBtn">📥 Exporter CSV</button>
            </div>
        </div>
        <div id="statsContainer" class="stats"></div>
        <div class="table-container">
            <table id="studentsTable">
              <thead>
    <tr>
        <th class="sortable" data-sort="id" style="cursor:pointer">ID ⇅</th>
        <th class="sortable" data-sort="nom" style="cursor:pointer">Nom ⇅</th>
        <th class="sortable" data-sort="parcours" style="cursor:pointer">Parcours ⇅</th>
        <th>Notes</th>
        <th class="sortable" data-sort="moyenne" style="cursor:pointer">Moyenne ⇅</th>
    </tr>
</thead>
                <tbody id="tableBody"></tbody>
            </table>
            <div id="noResults" style="display: none; text-align: center; padding: 20px;">Aucun étudiant trouvé</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
